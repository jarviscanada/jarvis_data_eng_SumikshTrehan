# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description:
      Remote Host Monitoring Agent is a professional-grade, agent-based infrastructure monitoring system designed to automate the collection of hardware specifications and real-time resource telemetry from distributed Linux servers. By deploying lightweight Bash scripts on individual nodes, the system continuously pushes critical metricssuch as CPU, memory, and disk utilizationto a centralized PostgreSQL database hosted within Docker. This architecture eliminates the need for manual checks by utilizing Cron-based automation and SQL analytics, empowering System Administrators and DevOps Engineers to proactively monitor server health, identify performance bottlenecks, and drive informed scaling decisions through data-driven insights.

  - name: "Advanced SQL"
    git_url: "/sql"
    description:
     This project features a suite of SQL scripts designed to transform raw relational data into actionable business intelligence within a multi-table environment comprising members, facilities, and bookings. The implementation utilizes advanced relational logic, including multi-table joins and correlated subqueries, to analyze facility utilization and member behavior patterns. By leveraging analytical window functions and complex aggregations, the project generates high-level reports on revenue distribution, membership growth, and resource allocation. These queries provide a robust framework for handling real-world data engineering tasks, focusing on query optimization and the extraction of precise, structured datasets for financial and operational reporting.

